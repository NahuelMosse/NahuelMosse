name: Catalog widgets

# Renders the live widgets of the README catalog into assets/catalog/gen and assets/catalog/kit and commits them.
on:
  push:
    branches: [profile-catalog]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalog-widgets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/catalog/gen/snake-noir.svg?color_snake=#d2231b&color_dots=#1d1b18,#5c2a22,#8a2a1f,#b4261c,#d2231b

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: catalog/3d-noir.json

      - name: readme-kit cards
        uses: Sagargupta16/readme-kit-action@v1
        continue-on-error: true
        with:
          config: catalog/profile.yml
          output-dir: assets/catalog/kit

      - name: Collect generated files
        run: |
          mkdir -p assets/catalog/gen/3d
          cp profile-3d-contrib/profile-3d-noir.svg assets/catalog/gen/3d/ 2>/dev/null || true
          rm -rf profile-3d-contrib

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-hosted live widgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/catalog/stats.mjs

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: render catalog widgets [skip ci]"
          file_pattern: "assets/catalog README.md"
